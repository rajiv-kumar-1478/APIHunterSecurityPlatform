services:
  # ─── 1. Backend Web API (ASP.NET Core / .NET 10) ─────────────
  - type: web
    name: apihunter-api
    runtime: docker
    dockerfilePath: deployment/docker/Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Database__ConnectionString
        sync: false # Set your Aiven Cloud PostgreSQL connection string in Render UI
      - key: ApiHunterSource__ConnectionString
        sync: false # Set your Supabase APIHunter database connection string in Render UI
      # The external APIHunter DB is only reachable from the VPS. Upload the SSH
      # private key as a Render Secret File named `vps_ssh_key` (mounted at
      # /etc/secrets/vps_ssh_key) and pin the host key fingerprint in the UI.
      - key: VpsSsh__Enabled
        value: "true"
      - key: VpsSsh__Host
        sync: false
      - key: VpsSsh__Port
        value: "22"
      - key: VpsSsh__Username
        value: ubuntu
      - key: VpsSsh__PrivateKeyPath
        value: /etc/secrets/vps_ssh_key
      - key: VpsSsh__PrivateKeyPassphrase
        sync: false
      - key: VpsSsh__HostKeyFingerprint
        sync: false
      - key: VpsSsh__RemoteWorkDir
        value: /tmp/apihunter-repos
      - key: VpsSsh__MaxArchiveBytes
        value: "536870912"
      # At least one AI provider key is required for the repository secret audit.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AiInvestigation__MaxFilesPerInvestigation
        value: "250"
      - key: AiInvestigation__MaxAiCallsPerInvestigation
        value: "30"
      - key: Security__MasterEncryptionKey
        generateValue: true
      - key: Authentication__JwtSecret
        generateValue: true
      - key: Authentication__RequireHttps
        value: "true"
      - key: Authentication__SessionDurationMinutes
        value: "1440"
      - key: DataProtection__KeyPath
        value: /app/dp-keys
      - key: DataProtection__ApplicationName
        value: APIHunterPlatform
      - key: Tenant__Id
        value: 00000000-0000-0000-0000-000000000001
      - key: Seed__AdminEmail
        value: admin@apihunter.local
      - key: Seed__AdminPassword
        generateValue: true
      - key: Cors__AllowedOrigins__0
        fromService:
          type: web
          name: apihunter-frontend
          property: host
      - key: ScannerRuntime__RuntimeMode
        value: UnsafeLocalProcessFallback
      - key: ScannerRuntime__AllowUnsafeProcessFallback
        value: "true"
      - key: ScanJobConsumer__Enabled
        value: "true"

  # ─── 2. Next.js Frontend Dashboard (App Router / Turbopack) ───────────────
  - type: web
    name: apihunter-frontend
    runtime: node
    rootDir: frontend/dashboard
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL
        value: https://apihunter-api.onrender.com
        