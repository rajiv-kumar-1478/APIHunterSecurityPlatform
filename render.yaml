services:
  # ─── 1. Backend Web API (ASP.NET Core / .NET 10) ─────────────
  - type: web
    name: apihunter-api
    runtime: docker
    dockerfilePath: deployment/docker/Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Database__ConnectionString
        sync: false # Set your Aiven Cloud PostgreSQL connection string in Render UI
      - key: ApiHunterSource__ConnectionString
        sync: false # Set your Supabase APIHunter database connection string in Render UI
      - key: Security__MasterEncryptionKey
        generateValue: true
      - key: Authentication__JwtSecret
        generateValue: true
      - key: Authentication__RequireHttps
        value: "true"
      - key: Authentication__SessionDurationMinutes
        value: "1440"
      - key: DataProtection__KeyPath
        value: /app/dp-keys
      - key: DataProtection__ApplicationName
        value: APIHunterPlatform
      - key: Tenant__Id
        value: 00000000-0000-0000-0000-000000000001
      - key: Seed__AdminEmail
        value: admin@apihunter.local
      - key: Seed__AdminPassword
        generateValue: true
      - key: Cors__AllowedOrigins__0
        fromService:
          type: web
          name: apihunter-frontend
          property: host
      - key: ScannerRuntime__RuntimeMode
        value: Disabled

  # ─── 2. Next.js Frontend Dashboard (App Router / Turbopack) ───────────────
  - type: web
    name: apihunter-frontend
    runtime: node
    rootDir: frontend/dashboard
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://apihunter-api.onrender.com
        