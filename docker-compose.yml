name: apihunter-security-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Tenant__Id: ${TENANT_ID:?TENANT_ID is required}
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-platform_db};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Security__MasterEncryptionKey: ${MASTER_ENCRYPTION_KEY:-replace_with_32_char_master_key_for_entropy_ok!}
      DataProtection__KeyPath: /app/dp-keys
      DataProtection__ApplicationName: APIHunterPlatform
      Authentication__RequireHttps: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      ScannerRuntime__RuntimeMode: ${SCANNER_RUNTIME_MODE:-UnsafeLocalProcessFallback}
      ScannerRuntime__EgressGatewayMode: None
      ScannerRuntime__EgressNetworkName: ""
      ScannerRuntime__EgressGatewayEndpoint: ""
      ScannerRuntime__AllowUnsafeProcessFallback: "true"
      Notification__EmailProvider: ${EMAIL_PROVIDER:-smtp}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__UseTls: ${SMTP_USE_TLS:-true}
      SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
      SendGrid__From: ${SENDGRID_FROM:-}
      Mailgun__ApiKey: ${MAILGUN_API_KEY:-}
      Mailgun__Domain: ${MAILGUN_DOMAIN:-}
      Mailgun__Region: ${MAILGUN_REGION:-us}
      Mailgun__From: ${MAILGUN_FROM:-}
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - dp_keys:/app/dp-keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - backend

  worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      Tenant__Id: ${TENANT_ID:?TENANT_ID is required}
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-platform_db};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Security__MasterEncryptionKey: ${MASTER_ENCRYPTION_KEY:-replace_with_32_char_master_key_for_entropy_ok!}
      DataProtection__KeyPath: /app/dp-keys
      DataProtection__ApplicationName: APIHunterPlatform
      ScannerRuntime__RuntimeMode: ${SCANNER_RUNTIME_MODE:-UnsafeLocalProcessFallback}
      ScannerRuntime__EgressGatewayMode: None
      ScannerRuntime__EgressNetworkName: ""
      ScannerRuntime__EgressGatewayEndpoint: ""
      ScannerRuntime__AllowUnsafeProcessFallback: "true"
      ScanJobConsumer__Enabled: "true"
      CampaignScheduler__GlobalEnabled: "true"
    volumes:
      - dp_keys:/app/dp-keys
    networks:
      - backend
      - outbound

  frontend:
    build:
      context: frontend/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - edge

networks:
  edge:
  backend:
    internal: true
  outbound:

volumes:
  pgdata:
  dp_keys:
